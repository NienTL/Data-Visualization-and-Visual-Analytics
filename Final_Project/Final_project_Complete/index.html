<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://d3js.org/d3.v6.js"></script>
    <title>Spotify Songs 2023</title>
    
</head>
<style>
    body {
        padding: 20px;
        background-color: #f5ebe0;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        color:#4923F4;
    }

    .wrap {
      display: flex;
      height:500px;
      align-items: center;
      justify-content: center;
    }

    #rank, #cloud {
        display: flex;
        padding: 50px;
        height:300px;
        width:400px;
        align-items: center;
        justify-content: center;
    }

    #rank_button, #cloud_button{
        background-color:aliceblue;
        border-radius: 10px;
        stroke: gray;
        stroke-width: 5px;
        opacity: 1;
    }

    #rank_text, #cloud_text{
        height:30px;
    }

    #cloud_pic {
        width: 400px;
        height: 250px;
    }

    #rank_pic {
        width: 400px;
        height: 250px;
    }


</style>
<body>
    <center>
    <h1>Your Music Journey Starts Here</h1>
    <div class="wrap">
        <div id = rank>
            <button type="button" id="rank_button">
                <h2 id = rank_text>Discover Songs by Attributes & Rankings</h2>
                <div id = rank_pic>
                    <img src="./pic/graphic.png" alt="rank_pic" width=60%>
                </div>
            </button>
        </div>
        <div id = cloud>
            <button type="button" id="cloud_button">
                <h2 id = cloud_text>Dive into Music by Artists</h2>
                <div id = cloud_pic>
                    <img src="./pic/singer.png" alt="rank_pic" width=60%>
                </div>
            </button>
        </div>
        <div id="my_dataviz"></div>
    </div>
    </center>
</body>
</html>
<script>
    const mouseover = function(event,d){
        d3.select(this).style("background-color",'rgb(214, 233, 250)')
    };

    const mouseleave = function(){
        d3.select(this).style("background-color",'aliceblue')
    };

    d3.select('#rank_button')
        .on("mouseover",mouseover)
        .on('mouseleave',mouseleave)
        .on('click',function(){
            window.location.href = './rank.html'
        });

    d3.select('#cloud_button')
        .on('mouseover',mouseover)
        .on('mouseleave',mouseleave)
        .on('click',function(){
            window.location.href = './wordcloud_bubble.html'
        });
</script>
